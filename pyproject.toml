[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "centaloid"
version = "1.0.0"
description = "PET-CT Centiloid Calculator for Beta-Amyloid Imaging"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pydicom>=2.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "nibabel>=5.0.0",
    "matplotlib>=3.7.0",
    "Pillow>=9.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
centaloid = "centaloid.main:main"

[project.gui-scripts]
centaloid-gui = "centaloid.main:main_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
